<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="560" height="160" fill="#1B1810"/>

  <!-- Icon frame -->
  <rect x="10" y="10" width="140" height="140" rx="28"
        fill="none" stroke="#F2A33C" stroke-width="7"/>

  <!-- Prompt chevron ">" -->
  <path d="M 48 46 L 78 80 L 48 114"
        fill="none" stroke="#F2A33C" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plus "+" : the add-on -->
  <path d="M 96 80 L 130 80 M 113 63 L 113 97"
        fill="none" stroke="#F2A33C" stroke-width="14"
        stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="190" y="98"
        font-family="'Inter','Avenir Next','Segoe UI',ui-sans-serif,sans-serif"
        font-size="56" font-weight="650"
        fill="#EDEAE3" letter-spacing="-1">aiaddons</text>

  <!-- Tagline -->
  <text x="192" y="124"
        font-family="'SF Mono','JetBrains Mono',ui-monospace,monospace"
        font-size="16" fill="#F2A33C" letter-spacing="0.5">package manager for AI coding agents</text>
</svg>
