<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="160" height="160" rx="36" fill="#1B1810"/>

  <!-- Outer frame: terminal window, suggested rather than literal -->
  <rect x="10" y="10" width="140" height="140" rx="28"
        fill="none" stroke="#F2A33C" stroke-width="7"/>

  <!-- Prompt chevron ">" -->
  <path d="M 48 46 L 78 80 L 48 114"
        fill="none" stroke="#F2A33C" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plus "+" : the add-on -->
  <path d="M 96 80 L 130 80 M 113 63 L 113 97"
        fill="none" stroke="#F2A33C" stroke-width="14"
        stroke-linecap="round"/>
</svg>
