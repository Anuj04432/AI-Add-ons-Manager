id: figma-mcp
name: Figma MCP Server
version: 1.40.6
description: Model Context Protocol server for Figma design inspection, design token extraction, and design-to-code auditing.
documentation_url: https://github.com/southleft/figma-console-mcp
license: MIT
category: design
integration_type: mcp
target_agents:
  - '*'
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: figma-console-mcp
  checksum: sha256:4635cb61e3b90c85d556403b6bfc0cf94ac4d19bc15171bca60d864ca31bc3ca
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: community
  publisher:
    name: Southleft
    url: https://github.com/southleft
    declared_verified: false
  allowed_executables:
    - npx
tags:
  - figma
  - design
  - design-tokens
  - ui-ux
  - mcp
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: figma-console-mcp
    env_vars:
      - name: FIGMA_ACCESS_TOKEN
        required: true
        secret: true
        description: Figma Personal Access Token (obtain from Figma Account Settings under Security Personal access tokens)
        value_pattern: ^fig(d|pat)_[a-zA-Z0-9_\-]+$
        min_length: 20
        format_description: starts with figd_ or figpat_
