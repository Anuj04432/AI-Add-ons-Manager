id: playwright-mcp
name: Playwright Browser Automation MCP Server
version: 1.0.0
description: Official browser automation and web scraping MCP server powered by Microsoft Playwright.
documentation_url: https://github.com/microsoft/playwright-mcp
license: Apache-2.0
category: testing
integration_type: mcp
target_agents:
  - "*"
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: "@playwright/mcp"
  checksum: "sha256:c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3"
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: verified
  publisher:
    name: Microsoft Playwright Team
    url: https://github.com/microsoft/playwright-mcp
    declared_verified: true
  allowed_executables:
    - npx
tags:
  - playwright
  - browser-automation
  - testing
  - scraping
  - mcp
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: "@playwright/mcp"
    env_vars: []
