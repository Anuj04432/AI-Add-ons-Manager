id: firecrawl-mcp
name: Firecrawl MCP Server
version: 3.25.5
description: Model Context Protocol server providing web scraping, search, crawling,
  and content extraction via the Firecrawl API.
documentation_url: https://github.com/firecrawl/firecrawl-mcp-server
license: MIT
category: search
integration_type: mcp
target_agents:
  - '*'
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: firecrawl-mcp
  checksum: sha256:d1d2137fdd163afafce5a2c46d644d13ab1a211ac49a64f450011e60015d8821
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: verified
  publisher:
    name: Firecrawl
    url: https://github.com/firecrawl
    declared_verified: true
  allowed_executables:
    - npx
tags:
  - firecrawl
  - web-scraping
  - search
  - crawling
  - mcp
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: firecrawl-mcp
    env_vars:
      - name: FIRECRAWL_API_KEY
        required: false
        secret: true
        description: Firecrawl API Key (optional for self-hosted instances, obtain
          from firecrawl.dev)
        value_pattern: ^fc-[a-zA-Z0-9_\-]+$
        min_length: 10
        format_description: starts with fc-
