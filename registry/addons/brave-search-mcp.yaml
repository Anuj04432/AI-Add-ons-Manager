id: brave-search-mcp
name: Brave Search MCP Server
version: 0.6.2
description: Model Context Protocol server providing web and local search capabilities
  via the Brave Search API.
documentation_url: https://github.com/modelcontextprotocol/servers
license: MIT
category: search
integration_type: mcp
target_agents:
  - '*'
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: '@modelcontextprotocol/server-brave-search'
  checksum: sha256:91733a4e1e0c0de6738d3542135c40bd4356aa48a336191c855e4f9feac40f85
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: verified
  publisher:
    name: Model Context Protocol Team
    url: https://github.com/modelcontextprotocol
    declared_verified: true
  allowed_executables:
    - npx
tags:
  - brave-search
  - web-search
  - search
  - mcp
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: '@modelcontextprotocol/server-brave-search'
    env_vars:
      - name: BRAVE_API_KEY
        required: true
        secret: true
        description: Brave Search API Key (obtain from brave.com/search/api)
        value_pattern: ^BSA[a-zA-Z0-9_\-]+$
        min_length: 10
        format_description: starts with BSA
