id: github-mcp
name: GitHub MCP Server
version: 2025.4.8
description: Model Context Protocol server for searching code, managing PRs, and inspecting
  issues.
documentation_url: https://github.com/github/github-mcp-server
license: MIT
category: developer-tools
integration_type: mcp
target_agents:
  - '*'
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: '@modelcontextprotocol/server-github'
  checksum: sha256:1d5b1bca9305adf0c8055131f2286514c9bea6eb31100460899a1ed9ffece5c1
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: verified
  publisher:
    name: GitHub / Model Context Protocol Team
    url: https://github.com/github
    declared_verified: true
  allowed_executables:
    - npx
tags:
  - github
  - mcp
  - git
  - developer-tools
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: '@modelcontextprotocol/server-github'
    env_vars:
      - name: GITHUB_PERSONAL_ACCESS_TOKEN
        required: true
        secret: true
        description: GitHub Personal Access Token with repository access
        value_pattern: ^(ghp|github_pat|gho)_[a-zA-Z0-9_]+$
        min_length: 40
        format_description: starts with ghp_, github_pat_, or gho_
