id: postgres-mcp
name: PostgreSQL Database MCP Server
version: 1.1.0
description: Model Context Protocol server for inspecting database schemas and executing
  read-only SQL queries.
documentation_url: https://github.com/modelcontextprotocol/servers
license: MIT
category: database
integration_type: mcp
target_agents:
  - '*'
supported_scopes:
  - global
  - workspace
source:
  source_type: package
  package_name: '@modelcontextprotocol/server-postgres'
  checksum: sha256:a1b2c3d4e5f678901234567890abcdef1234567890abcdef1234567890abcdef
dependencies:
  - name: npx
    type: cli
    required: true
trust:
  verification_status: verified
  publisher:
    name: Model Context Protocol Team
    url: https://github.com/modelcontextprotocol
    declared_verified: true
  allowed_executables:
    - npx
tags:
  - postgresql
  - database
  - sql
  - mcp
handler_spec:
  mcp:
    transport: stdio
    runtime: npx
    package_name: '@modelcontextprotocol/server-postgres'
    env_vars:
      - name: DATABASE_URL
        required: true
        secret: true
        description: PostgreSQL connection string (postgresql://user:password@host:5432/database)
        value_pattern: ^postgres(ql)?://.*
        format_description: starts with postgres:// or postgresql://
